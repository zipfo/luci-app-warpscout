name: Release Packages & Custom Feed

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-ipk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build .ipk package and opkg feed index
        run: |
          set -e
          mkdir -p out/ipk
          chmod -R 777 out

          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/out/ipk:/out" \
            openwrt/sdk:x86-64-24.10.0 \
            sh -c '
              set -e
              mkdir -p package/luci-app-warpscout
              cp -r /src/Makefile /src/htdocs /src/po /src/root package/luci-app-warpscout/

              ./scripts/feeds update -a
              ./scripts/feeds install -a

              echo "CONFIG_PACKAGE_luci-app-warpscout=y" >> .config
              echo "CONFIG_PACKAGE_luci-i18n-warpscout-ru=y" >> .config
              echo "CONFIG_PACKAGE_liblua=y" >> .config
              make defconfig

              LUA_PKG=$(find package -maxdepth 4 -type d -name lua | head -n 1)
              if [ -n "$LUA_PKG" ]; then
                make "${LUA_PKG}/compile" -j"$(nproc)" V=s
              fi

              make package/luci-app-warpscout/compile -j"$(nproc)" V=s

              find bin/packages -type f -name "luci-*warpscout*.ipk" -exec cp -v {} /out/ \;
              ./scripts/ipkg-make-index.sh /out > /out/Packages
              gzip -k -f /out/Packages
              ls -la /out
            '

      - name: Upload .ipk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipk-feed
          path: out/ipk

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build .apk package and apk feed index
        run: |
          set -e
          mkdir -p out/apk
          chmod -R 777 out

          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/out/apk:/out" \
            openwrt/sdk:x86-64-snapshot \
            sh -c '
              set -e
              mkdir -p package/luci-app-warpscout
              cp -r /src/Makefile /src/htdocs /src/po /src/root package/luci-app-warpscout/

              ./scripts/feeds update -a
              ./scripts/feeds install -a

              echo "CONFIG_PACKAGE_luci-app-warpscout=y" >> .config
              echo "CONFIG_PACKAGE_luci-i18n-warpscout-ru=y" >> .config
              echo "CONFIG_PACKAGE_liblua=y" >> .config
              make defconfig

              LUA_PKG=$(find package -maxdepth 4 -type d -name lua | head -n 1)
              if [ -n "$LUA_PKG" ]; then
                make "${LUA_PKG}/compile" -j"$(nproc)" V=s
              fi

              make package/luci-app-warpscout/compile -j"$(nproc)" V=s

              find bin/packages -type f -name "luci-*warpscout*.apk" -exec cp -v {} /out/ \;
              APK_BIN="$(command -v apk || find staging_dir/host/bin -name apk -type f | head -n 1)"
              "$APK_BIN" mkndx --allow-untrusted --output /out/packages.adb /out/*.apk
              ls -la /out
            '

      - name: Upload .apk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-feed
          path: out/apk

  release:
    needs: [build-ipk, build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download .ipk artifacts
        uses: actions/download-artifact@v4
        with:
          name: ipk-feed
          path: release-assets/ipk

      - name: Download .apk artifacts
        uses: actions/download-artifact@v4
        with:
          name: apk-feed
          path: release-assets/apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/ipk/*.ipk
            release-assets/apk/*.apk

  publish-feed:
    needs: [build-ipk, build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download .ipk artifacts
        uses: actions/download-artifact@v4
        with:
          name: ipk-feed
          path: feed-site/ipk

      - name: Download .apk artifacts
        uses: actions/download-artifact@v4
        with:
          name: apk-feed
          path: feed-site/apk

      - name: Prepare GitHub Pages feed directory
        run: |
          cp install.sh feed-site/install.sh
          cat > feed-site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>luci-app-warpscout OpenWrt Feed</title></head>
          <body>
            <h1>luci-app-warpscout OpenWrt Feed</h1>
            <p>Install automatically:</p>
            <pre>wget -qO- https://zipfo.github.io/luci-app-warpscout/install.sh | sh</pre>
            <ul>
              <li><a href="ipk/Packages">opkg feed (OpenWrt 24.10): ipk/</a></li>
              <li><a href="apk/packages.adb">apk feed (OpenWrt 25.x / snapshot): apk/</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Deploy feed to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./feed-site
